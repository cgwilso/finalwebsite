<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Matching Game</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-image: url('assets/img/brain.jpeg');
    }

    h1 {
      color: #000000;
      margin-bottom: 20px;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-gap: 10px;
    }

    .card {
      width: 100px;
      height: 100px;
      background: #3498db;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      border-radius: 10px;
    }

    .card.revealed {
      background: #2ecc71;
    }

    .card.matched {
      background: #95a5a6;
      cursor: default;
    }
  </style>
</head>
<body>

<h1>Memory Matching Game</h1>
<h4> FIND THE PAIRS BELOW! </h4>
<div class="game-board" id="gameBoard"></div>

<script>
  const icons = ['🍕','🍕','🐱','🐱','⚽','⚽','🎮','🎮','🚗','🚗','🎲','🎲','🍎','🍎','👻','👻'];
  let shuffledIcons = icons.sort(() => 0.5 - Math.random());

  const gameBoard = document.getElementById('gameBoard');
  let firstCard = null;
  let lockBoard = false;

  shuffledIcons.forEach(icon => {
    const card = document.createElement('div');
    card.classList.add('card');
    card.dataset.icon = icon;
    card.innerText = '';
    gameBoard.appendChild(card);

    card.addEventListener('click', () => {
      if (lockBoard || card.classList.contains('matched') || card === firstCard) return;

      card.innerText = card.dataset.icon;
      card.classList.add('revealed');

      if (!firstCard) {
        firstCard = card;
      } else {
        if (card.dataset.icon === firstCard.dataset.icon) {
          card.classList.add('matched');
          firstCard.classList.add('matched');
          firstCard = null;
        } else {
          lockBoard = true;
          setTimeout(() => {
            card.innerText = '';
            firstCard.innerText = '';
            card.classList.remove('revealed');
            firstCard.classList.remove('revealed');
            firstCard = null;
            lockBoard = false;
          }, 800);
        }
      }
    });
  });
</script>

</body>
</html>
